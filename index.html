<!DOCTYPE html>
<html>

<head>

    <!-- Inclusion correcte du SDK Trello Power-Up via le CDN officiel -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>

</head>

<body>

    <script>
        TrelloPowerUp.initialize({
            'card-buttons': function (t) {
                return [{
                    text: 'Générer Rapport',
                    callback: function (t) {
                        alert('Le Power-Up fonctionne !');
                        return t;
                    }
                }];
            }
        });
    </script>

</body>

</html>
