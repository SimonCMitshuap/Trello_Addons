<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Trello Addon</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
    <h1>Trello Addon</h1>
    <script>
TrelloPowerUp.initialize({

    'card-buttons': function (t) {

        return [{
            text: 'Générer Rapport',

            callback: function (t) {

                return t.card('id', 'name', 'desc')
                    .then(function (card) {

                        var message =
                            'ID : ' + card.id +
                            '\n\nNom : ' + card.name +
                            '\n\nDescription : ' + card.desc;

                        alert(message);

                    })
                    .catch(function (err) {

                        alert('Erreur : ' + err);

                    });

            }

        }];

    }

});
</script>
</body>
</html>
