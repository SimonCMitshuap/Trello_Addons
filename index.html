    let carteCourante;

    return t.card('id', 'name')

        .then(function(card) {

            carteCourante = card;

            return chargerCommentaires(card.id);

        })

        .then(function(comments) {

            let rapportHtml = construireRapport(

                comments

        })

        .catch(function(error) {

            console.error(error);

            alert(
                "Erreur : " +
                error.message
            );

        });

}
        
// Lecture des commentaires Trello
function chargerCommentaires(cardId) {

    const url =
        "https://api.trello.com/1/cards/" +
        cardId +
        "/actions?filter=commentCard" +
        "&key=" + API_KEY +
        "&token=" + TOKEN;

    return fetch(url)

        .then(function(response) {

            return response.json();

        });

}
        
// Construction du rapport
function construireRapport(card, comments) {

    let html = "";

    html += titreRapport(card);

    comments.reverse().forEach(function(comment) {

        html += blocCommentaire(comment);

    });

    html += boutonsActions();

    return html;

}

function telechargerRapport(html) {

    const blob =
        new Blob(
            [html],
            {
                type: "text/html"
            }
        );

    const lien =
        document.createElement("a");

    lien.href =
