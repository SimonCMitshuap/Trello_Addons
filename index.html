<!DOCTYPE html>
<html>
    <head>
        <script src="https://p.trellocdn.com/power-up.min.js"></script>
    </head>
    <body>

    <h1>Power-Up actif</h1>

    <script>
alert("VERSION 21");
console.log("SCRIPT CHARGE");

const API_KEY = "3d8c380a7f3bdb8544d2114dc6ab57b5";
const TOKEN = "ATTA8ed5551a5bab744a6bfd5a5c5da3f418f444e9b5b611e1d494ad50aabf313fa32FA960B0";

TrelloPowerUp.initialize({

    'card-buttons': function(t) {

        console.log("CARD BUTTONS");

        return [{
            text: 'TestV3',

            callback: function(t) {

                return t.card('id', 'name')

                    .then(function(card) {

                        console.log("Carte:", card);

                        const url =
                            "https://api.trello.com/1/cards/" +
                            card.id +
                            "/actions?filter=commentCard" +
                            "&key=" + API_KEY +
                            "&token=" + TOKEN;

                        console.log(url);

                        return fetch(url);

                    })

                    .then(function(response) {

                        return response.json();

                    })

                    .then(function(comments) {

                        console.log(comments);

                        let rapport = "";
                    
                        comments.reverse().forEach(function(comment) {
                    
                        rapport +=
                            comment.memberCreator.fullName +
                            "\n" +
                            comment.data.text +
                            "\n\n";
                    
                    });
                    
                    alert(rapport);

                    })

                    .catch(function(error) {

                        console.error(error);

                        alert(
                            "Erreur : " +
                            error.message
                        );

                    });

            }

        }];

    }

});
    </script>

    </body>
</html>
