<!DOCTYPE html>
<html>
    <head>
        <script src="https://p.trellocdn.com/power-up.min.js"></script>
    </head>
    <body>

    <h1>Power-Up actif</h1>

    <script>

    console.log("SCRIPT CHARGE");

    TrelloPowerUp.initialize({

        'card-buttons': function(t) {

            console.log("CARD BUTTONS");

            return [{
                text: 'TestV3',
               callback: function(t) {
                   return t.card('id', 'name')
                        .then(function(card) {
                            alert(
                                'ID: ' + card.id +
                                '\nNom: ' + card.name
                            );
                        });
                }
            }];

        }

    });

    </script>

    </body>
</html>
